<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="title desc">
  <title id="title">Cache address decomposition</title><desc id="desc">A 48-bit address split into a 36-bit tag, 6-bit set index, and 6-bit byte offset.</desc>
  <g fill="currentColor" fill-opacity=".06" stroke="currentColor" stroke-width="1.25"><rect x="40" y="105" width="450" height="85"/><rect x="490" y="105" width="135" height="85"/><rect x="625" y="105" width="135" height="85"/></g>
  <g font-family="system-ui, sans-serif" fill="currentColor" text-anchor="middle"><text x="400" y="55" font-size="25" font-weight="700">48-bit physical address</text><text x="265" y="143" font-size="22" font-weight="700">Tag</text><text x="265" y="170" font-size="18">36 bits</text><text x="557" y="143" font-size="20" font-weight="700">Set index</text><text x="557" y="170" font-size="18">6 bits</text><text x="692" y="143" font-size="19" font-weight="700">Byte offset</text><text x="692" y="170" font-size="18">6 bits</text><g font-size="18" font-weight="700"><text x="40" y="224">47</text><text x="490" y="224">12</text><text x="625" y="224">6</text><text x="760" y="224">0</text></g><text x="400" y="270" font-size="18">The address selects a set and identifies a block; it does not select a way.</text></g>
</svg>

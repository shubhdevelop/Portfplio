<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title desc">
  <title id="title">Logically divided memory</title><desc id="desc">Four 64-byte memory blocks and formulas for deriving a block number and offset from an address.</desc>
  <g fill="none" stroke="currentColor" stroke-width="1.25"><rect x="35" y="45" width="430" height="255"/><path d="M250 45V300M35 96H465M35 147H465M35 198H465M35 249H465"/><rect x="515" y="65" width="245" height="210" rx="12" fill="currentColor" fill-opacity=".06"/></g>
  <g font-family="system-ui, sans-serif" fill="currentColor" text-anchor="middle"><g font-size="20" font-weight="700"><text x="142" y="78">Memory block</text><text x="358" y="78">Byte addresses</text></g><g font-size="19"><text x="142" y="128">0</text><text x="358" y="128">0–63</text><text x="142" y="179">1</text><text x="358" y="179">64–127</text><text x="142" y="230">2</text><text x="358" y="230">128–191</text><text x="142" y="281">3</text><text x="358" y="281">192–255</text></g></g>
  <g font-family="system-ui, sans-serif" fill="currentColor"><text x="638" y="108" font-size="22" font-weight="700" text-anchor="middle">For an address A</text><text x="540" y="158" font-size="18">Block number</text><text x="540" y="184" font-size="22" font-weight="700">⌊A / 64⌋</text><text x="540" y="226" font-size="18">Offset within block</text><text x="540" y="252" font-size="22" font-weight="700">A mod 64</text></g>
</svg>

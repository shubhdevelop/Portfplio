<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Worked cache lookup example</title><desc id="desc">A 32 KiB, 8-way cache with 64-byte lines has 64 sets. Address 1000 selects set 15 with tag zero and byte offset 40.</desc>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="currentColor"/></marker></defs>
  <g fill="none" stroke="currentColor" stroke-width="1.25"><rect x="30" y="35" width="350" height="165" rx="12" fill="currentColor" fill-opacity=".05"/><rect x="420" y="35" width="350" height="165" rx="12" fill="currentColor" fill-opacity=".05"/><rect x="35" y="270" width="150" height="82" rx="12"/><rect x="235" y="270" width="150" height="82" rx="12"/><rect x="435" y="270" width="150" height="82" rx="12"/><rect x="635" y="270" width="130" height="82" rx="12"/><path d="M185 311H225M385 311H425M585 311H625" marker-end="url(#arrow)"/></g>
  <g font-family="system-ui, sans-serif" fill="currentColor"><text x="55" y="72" font-size="21" font-weight="700">Cache configuration</text><g font-size="18"><text x="55" y="106">32 KiB capacity, 64-byte lines</text><text x="55" y="134">8 ways → 512 slots → 64 sets</text><text x="55" y="162">6 offset bits, 6 set-index bits</text></g><text x="445" y="72" font-size="21" font-weight="700">Address A = 1000</text><g font-size="18"><text x="445" y="106">Block number = ⌊1000 / 64⌋ = 15</text><text x="445" y="134">Set index = 15 mod 64 = 15</text><text x="445" y="162">Tag = ⌊15 / 64⌋ = 0; offset = 40</text></g></g>
  <g font-family="system-ui, sans-serif" fill="currentColor" text-anchor="middle"><text x="110" y="302" font-size="18" font-weight="700">Address</text><text x="110" y="328" font-size="18">1000</text><text x="310" y="302" font-size="18" font-weight="700">Derive fields</text><text x="310" y="328" font-size="18">tag, set, offset</text><text x="510" y="302" font-size="18" font-weight="700">Check set 15</text><text x="510" y="328" font-size="18">for tag 0</text><text x="700" y="302" font-size="18" font-weight="700">Read byte</text><text x="700" y="328" font-size="18">at offset 40</text><text x="400" y="394" font-size="18">The set index tells where to look. The tag tells what to look for.</text></g>
</svg>

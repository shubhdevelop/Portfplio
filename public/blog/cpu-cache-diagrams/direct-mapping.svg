<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" role="img" aria-labelledby="title desc">
  <title id="title">Direct cache mapping</title><desc id="desc">Each group of memory blocks maps to one cache line, showing a conflict between blocks zero and eight.</desc>
  <g fill="none" stroke="currentColor" stroke-width="1.25"><rect x="35" y="50" width="435" height="275"/><path d="M300 50V325M35 105H470M35 160H470M35 215H470M35 270H470"/><rect x="525" y="78" width="230" height="215" rx="12" fill="currentColor" fill-opacity=".07"/></g>
  <g font-family="system-ui, sans-serif" fill="currentColor" text-anchor="middle"><text x="168" y="85" font-size="21" font-weight="700">Memory blocks</text><text x="385" y="85" font-size="21" font-weight="700">Cache line</text><g font-size="19"><text x="168" y="140">0, 8, 16, ...</text><text x="385" y="140">0</text><text x="168" y="195">1, 9, 17, ...</text><text x="385" y="195">1</text><text x="168" y="250">2, 10, 18, ...</text><text x="385" y="250">2</text><text x="168" y="305">7, 15, 23, ...</text><text x="385" y="305">7</text></g></g>
  <g font-family="system-ui, sans-serif" fill="currentColor"><text x="548" y="120" font-size="23" font-weight="700">Placement conflict</text><text x="548" y="160" font-size="19">Block 0 and block 8</text><text x="548" y="188" font-size="19">both map to line 0.</text><text x="548" y="238" font-size="18">They repeatedly evict</text><text x="548" y="264" font-size="18">one another.</text></g>
</svg>
